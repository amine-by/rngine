<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Head faces UP (rotated 270deg from base RIGHT-facing art) -->
  <g transform="rotate(270 50 50)">
    <path d="M 0 18
             L 55 18
             Q 96 22 100 50
             Q 96 78 55 82
             L 0 82
             Z"
          fill="#4ADE80" stroke="#16A34A" stroke-width="4" stroke-linejoin="round"/>

    <!-- scale texture -->
    <circle cx="18" cy="32" r="3" fill="#22C55E" opacity="0.5"/>
    <circle cx="30" cy="28" r="3" fill="#22C55E" opacity="0.5"/>
    <circle cx="18" cy="68" r="3" fill="#22C55E" opacity="0.5"/>
    <circle cx="30" cy="72" r="3" fill="#22C55E" opacity="0.5"/>

    <!-- eyes -->
    <circle cx="62" cy="34" r="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <circle cx="62" cy="66" r="9" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <circle cx="65" cy="34" r="4" fill="#14532D"/>
    <circle cx="65" cy="66" r="4" fill="#14532D"/>

    <!-- tongue -->
    <path d="M 94 50 L 99 50 M 99 50 L 100 47 M 99 50 L 100 53"
          stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
