<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertical body segment. Connecting edges (y=0 and y=100) are a
       flush, sharp-cornered band from x=18 to x=82 so they align exactly
       with the head, tail, and turn pieces. Rotated 90deg from horizontal. -->
  <g transform="rotate(90 50 50)">
    <rect x="0" y="18" width="100" height="64" fill="#4ADE80" stroke="#16A34A" stroke-width="4"/>

    <circle cx="20" cy="34" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="50" cy="34" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="80" cy="34" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="35" cy="50" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="65" cy="50" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="20" cy="66" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="50" cy="66" r="3.5" fill="#22C55E" opacity="0.55"/>
    <circle cx="80" cy="66" r="3.5" fill="#22C55E" opacity="0.55"/>
  </g>
</svg>
